<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Ride — Ride Down South</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: transparent; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 0; }
    .card { background: #0c1319; border: 1px solid #1a2230; border-radius: 12px; max-width: 860px; width: 100%; overflow: hidden; }
    .header { padding: 24px 40px 18px; border-bottom: 1px solid #1a2230; display: flex; align-items: center; gap: 14px; }
    .logo { width: 42px; height: 42px; border-radius: 8px; background: linear-gradient(135deg,#D97B2B,#a85a1b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 1px; flex-shrink: 0; }
    .header-text-top { font-size: 11px; letter-spacing: 2.5px; color: #D97B2B; font-weight: 600; text-transform: uppercase; }
    .header-text-sub { font-size: 12px; color: #aaa; margin-top: 1px; }
    .steps { display: flex; align-items: center; gap: 4px; padding: 16px 40px; border-bottom: 1px solid #1a2230; flex-wrap: wrap; }
    .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #555; flex-shrink: 0; }
    .dot.on { border-color: #D97B2B; color: #D97B2B; background: rgba(217,123,43,0.08); }
    .step-label { font-size: 11px; color: #777; font-weight: 400; white-space: nowrap; }
    .step-label.on { color: #ccc; }
    .step-label.active { font-weight: 600; }
    .step-line { height: 2px; background: #222; border-radius: 1px; flex: 1; min-width: 16px; }
    .step-line.done { background: #D97B2B; }
    .body { padding: 32px 40px 24px; }
    h2 { color: #e8e8e8; font-size: 19px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #aaa; font-size: 13px; margin-bottom: 24px; line-height: 1.6; }
    label.field-label { display: block; font-size: 12px; font-weight: 600; color: #bbb; margin-bottom: 6px; margin-top: 20px; letter-spacing: 0.2px; }
    .req { color: #D97B2B; margin-left: 3px; }
    input[type="text"], input[type="email"], input[type="tel"], textarea, select {
      width: 100%; padding: 11px 14px; background: #111820; border: 1px solid #1e2530; border-radius: 8px;
      color: #e0e0e0; font-size: 14px; font-family: 'Montserrat', sans-serif; outline: none;
    }
    input::placeholder, textarea::placeholder { color: #888 !important; opacity: 1 !important; }
    select { padding-right: 36px; -webkit-appearance: none; -moz-appearance: none; appearance: none; cursor: pointer; background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; }
    select option { background: #0c1218; color: #e0e0e0; }
    textarea { resize: vertical; min-height: 60px; }
    .err-border { border-color: #803030 !important; }
    .row { display: flex; gap: 14px; }
    .row > div { flex: 1; }
    .radio-group { background: #111820; border: 1px solid #1e2530; border-radius: 8px; padding: 10px 14px; margin-top: 4px; }
    .radio-item { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
    .radio-item:hover { background: rgba(217,123,43,0.04); }
    .radio-item.on { background: rgba(217,123,43,0.06); }
    .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.15s; }
    .radio-dot.on { border-color: #D97B2B; }
    .radio-dot-inner { width: 8px; height: 8px; border-radius: 50%; background: #D97B2B; display: none; }
    .radio-dot.on .radio-dot-inner { display: block; }
    .radio-text { font-size: 13px; color: #bbb; }
    .radio-item.on .radio-text { color: #e0e0e0; }
    .radio-price { font-size: 12px; color: #D97B2B; font-weight: 500; margin-left: auto; }
    .bike-section { font-size: 11px; color: #999; font-weight: 600; letter-spacing: 1px; padding: 2px 0 6px; text-transform: uppercase; }
    .bike-divider { border-top: 1px solid #1e2530; margin-top: 6px; padding-top: 10px; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 2px 0; }
    .checkbox { width: 20px; height: 20px; border-radius: 5px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
    .checkbox.on { background: #D97B2B; border-color: #D97B2B; }
    .check-text { font-size: 13px; color: #ccc; line-height: 1.5; }
    .check-text a { color: #D97B2B; text-decoration: underline; }
    .check-box { margin-top: 24px; padding: 14px 16px; background: #111820; border-radius: 8px; border: 1px solid #1e2530; }
    .price-card { background: #111820; border: 1px solid #1e2530; border-radius: 10px; padding: 18px 20px; margin-top: 24px; }
    .price-head { font-size: 11px; font-weight: 600; color: #D97B2B; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ccc; padding: 5px 0; }
    .price-val { font-weight: 600; color: #e0e0e0; font-variant-numeric: tabular-nums; }
    .price-val.green { color: #5a9a5a; }
    .price-total { border-top: 1px solid #252525; padding-top: 12px; margin-top: 6px; }
    .price-total .price-val { color: #D97B2B; font-weight: 700; font-size: 18px; }
    .price-note { font-size: 11px; color: #999; margin-top: 14px; line-height: 1.5; }
    .waitlist { background: rgba(217,123,43,0.08); border: 1px solid rgba(217,123,43,0.25); border-radius: 8px; padding: 11px 14px; font-size: 13px; color: #D97B2B; margin-top: 14px; line-height: 1.5; }
    .sum-row { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; padding: 4px 0; }
    .sum-lbl { color: #999; font-weight: 500; }
    .btns { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; flex-wrap: wrap; }
    .btn-p { padding: 12px 26px; background: linear-gradient(135deg,#D97B2B,#b5651d); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Montserrat', sans-serif; letter-spacing: 0.2px; }
    .btn-p:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-s { padding: 12px 22px; background: transparent; border: 1px solid #2a3040; border-radius: 8px; color: #bbb; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Montserrat', sans-serif; }
    .err-txt { color: #c04040; font-size: 13px; margin-top: 18px; }
    .footer { padding: 16px 40px; border-top: 1px solid #1a2230; text-align: center; font-size: 12px; color: #999; }
    .footer a { color: #D97B2B; text-decoration: none; }
    .spinner { width: 28px; height: 28px; border: 3px solid #1e2530; border-top-color: #D97B2B; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step, .hidden { display: none; }
    .step.active { display: block; }
    .helper { font-size: 12px; color: #aaa; margin: 4px 0 10px; line-height: 1.5; }
    @media (max-width: 600px) {
      .row { flex-direction: column; gap: 0; }
      .body { padding: 20px 18px 16px; }
      .steps { padding: 14px 18px; }
      .header { padding: 20px 18px 14px; }
      .footer { padding: 14px 18px; }
      .card { border-radius: 0; border-left: none; border-right: none; }
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <!-- Loading state -->
  <div id="loading" style="text-align:center;padding:80px 20px;">
    <div class="spinner"></div>
    <p style="color:#888;margin-top:14px;font-size:13px;">Loading tour availability...</p>
  </div>
</div>

<script>
(function() {
  var API_BASE = ''; // Same domain — Vercel serves both
  var isEmbedded = window.location.search.indexOf('embedded=1') !== -1;

  // State
  var tourData = null;
  var priceData = null;
  var fxRates = null;
  var step = 1;
  var form = {
    firstName:'', lastName:'', email:'', phone:'', country:'',
    tourCategory:'', tourVariant:'', departureDate:'', customDescription:'',
    participantType:'', roomType:'Single', roommateName:'', addPillion:'', bike:'',
    yearsRiding:'', bikeExperience:'', previousTours:'',
    onroad:'', offroad:'',
    licence:false,
    medical:'', anythingElse:'', referral:'', terms:false
  };

  var TOUR_CATEGORIES = [
    {v:'feast', l:'Feast of Southern Africa: Cape Town to Vic Falls'},
    {v:'edge21', l:'Edge of Africa: Cape Town to the Kruger Park'},
    {v:'edge14', l:'Edge of Africa: Cape Town to the Kruger Park (14 days, Nov-Dec 2026 only)'},
    {v:'sst', l:'Southern Sweep: Kruger Park to Cape Town'},
    {v:'bon', l:'Best of Namibia'},
    {v:'oneday', l:'1-Day Tour from Cape Town'},
    {v:'other', l:'One of the other tours I\u2019ve seen'},
    {v:'custom', l:'Custom Tour'}
  ];
  // Variant tour_id values MUST match the tour_id keys emitted by
  // /api/tour-availability (FoSA 21 -> feast-21, Edge 21/Edge 21 LWU -> edge-21,
  // Southern Sweep -> sst-14, etc.) so live departures resolve.
  var TOUR_VARIANTS = {
    feast: [
      {v:'feast-21', l:'21 days - Cape Town to Victoria Falls', default:true},
      {v:'feast-16', l:'16 days - Cape Town to Windhoek'}
    ],
    edge21: [
      {v:'edge-21', l:'Edge 21 LWU - Cape Town to the Kruger Park', default:true}
    ],
    edge14: [
      {v:'edge-14', l:'14 days - Cape Town to the Kruger Park', default:true}
    ],
    sst: [
      {v:'sst-14', l:'Southern Sweep - Kruger Park to Cape Town', default:true}
    ],
    bon: [
      {v:'bon-14', l:'15 days - Windhoek loop', default:true}
    ]
  };
  // Categories that need departure dates, pricing, bike selection
  var FULL_TOUR = {feast:true, edge21:true, edge14:true, sst:true, bon:true};

  var COUNTRIES = ['Australia','Austria','Belgium','Canada','Denmark','Finland','France','Germany','Republic of Ireland','Italy','Netherlands','New Zealand','Norway','South Africa','Spain','Sweden','Switzerland','UK and Northern Ireland','USA','Other'];
  var BIKES_STD = [
    {v:'crf1000', l:'Honda Africa Twin CRF1000 (2016\u20132018)'},
    {v:'transalp', l:'Honda Transalp 750 (2023\u20132025)'},
    {v:'nx500', l:'Honda NX500 (2024\u20132025)'}
  ];
  var BIKES_UP = [
    {v:'crf1100', l:'Honda Africa Twin CRF1100', k:'bike_upgrade_crf1100'},
    {v:'bmw1250gs', l:'BMW R1250GS', k:'bike_upgrade_bmw1250gs'}
  ];
  var YEARS = ['Less than 1 year','1\u20133 years','4\u201310 years','More than 10 years'];
  var ONROAD = ['Beginner \u2014 I\u2019m new at road touring','Intermediate \u2014 I\u2019ve got some limited road touring experience','Experienced \u2014 I\u2019ve done lots of road tours'];
  var OFFROAD = ['No gravel roads please','Beginner \u2014 still finding my way on gravel/dirt surfaces','Intermediate \u2014 I\u2019m comfortable on non-tarred surfaces','Experienced \u2014 I eat gravel roads for breakfast'];
  var REFERRAL = ['Google search','Social media','Friend or family referral','Magazine or publication','YouTube','Motorcycle club or forum','Repeat customer','Other'];

  var COUNTRY_CURRENCY = {
    'USA':'USD','Canada':'CAD','UK and Northern Ireland':'GBP',
    'Republic of Ireland':'EUR','Australia':'AUD','New Zealand':'NZD',
    'Germany':'EUR','France':'EUR','Italy':'EUR','Spain':'EUR',
    'Netherlands':'EUR','Belgium':'EUR','Austria':'EUR','Finland':'EUR',
    'Denmark':'DKK','Norway':'NOK','Sweden':'SEK','Switzerland':'CHF'
  };
  var CURRENCY_SYMBOLS = {
    'USD':'US$','CAD':'CA$','GBP':'\u00a3','AUD':'AU$','NZD':'NZ$',
    'EUR':'\u20ac','CHF':'CHF','DKK':'DKK','NOK':'NOK','SEK':'SEK'
  };

  function getLocalCurrency() {
    if (!form.country || form.country === 'South Africa' || form.country === 'Other') return null;
    return COUNTRY_CURRENCY[form.country] || null;
  }

  function fmtLocal(zarAmount) {
    var cur = getLocalCurrency();
    if (!cur || !fxRates || !fxRates[cur]) return '';
    var rate = fxRates[cur];
    var converted = Math.round(zarAmount * rate);
    var sym = CURRENCY_SYMBOLS[cur] || cur;
    return 'Approx. ' + sym + ' ' + converted.toLocaleString('en');
  }

  // Fetch FX rates (ZAR base)
  fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/zar.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.zar) {
        fxRates = {};
        var map = data.zar;
        if (map.usd) fxRates['USD'] = map.usd;
        if (map.cad) fxRates['CAD'] = map.cad;
        if (map.gbp) fxRates['GBP'] = map.gbp;
        if (map.aud) fxRates['AUD'] = map.aud;
        if (map.nzd) fxRates['NZD'] = map.nzd;
        if (map.eur) fxRates['EUR'] = map.eur;
        if (map.chf) fxRates['CHF'] = map.chf;
        if (map.dkk) fxRates['DKK'] = map.dkk;
        if (map.nok) fxRates['NOK'] = map.nok;
        if (map.sek) fxRates['SEK'] = map.sek;
      }
    })
    .catch(function() {});

  function fmt(n) {
    if (!n || n === '0') return '';
    var num = Number(String(n).replace(/,/g, ''));
    if (isNaN(num)) return '';
    if (num < 0) return '- ZAR ' + Math.abs(num).toLocaleString('en-ZA');
    return 'ZAR ' + num.toLocaleString('en-ZA');
  }
  function fmtDate(s) {
    if (!s) return '';
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var d;
    if (s.indexOf('/') !== -1) {
      // DD/MM/YYYY or D/M/YYYY from Google Sheets
      var parts = s.split('/');
      d = new Date(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10));
    } else {
      // YYYY-MM-DD fallback
      d = new Date(s + 'T00:00:00');
    }
    if (isNaN(d.getTime())) return s;
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
  }

  // Add n days to a date string (handles DD/MM/YYYY or YYYY-MM-DD), returns YYYY-MM-DD.
  function addDaysISO(s, n) {
    if (!s) return '';
    var d;
    if (s.indexOf('/') !== -1) {
      var p = s.split('/');
      d = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
    } else {
      d = new Date(s + 'T00:00:00');
    }
    if (isNaN(d.getTime())) return '';
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  // 16-day Feast shares the FoSA 21 departure but ends at Windhoek:
  // departure + 15 days (16 inclusive). All other variants use the live tour end date.
  function endDateFor(dep) {
    if (!dep) return '';
    if (form.tourVariant === 'feast-16') return addDaysISO(dep.departure_date, 15);
    return dep.tour_end_date;
  }

  // Parse a DD/MM/YYYY (or YYYY-MM-DD) departure string to a sortable timestamp.
  function depTime(s) {
    if (!s) return 0;
    var d;
    if (s.indexOf('/') !== -1) {
      var p = s.split('/');
      d = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
    } else {
      d = new Date(s + 'T00:00:00');
    }
    var t = d.getTime();
    return isNaN(t) ? 0 : t;
  }

  function getDeps() {
    if (!tourData || !form.tourVariant) return [];
    // 16-day Feast is a hop-off at Windhoek on the same FoSA 21 departure,
    // so it shares the 21-day departure dates.
    var depKey = (form.tourVariant === 'feast-16') ? 'feast-21' : form.tourVariant;
    // Drop departures that have already left — the availability feed still
    // carries them (confirmed live 2026-07-28: BoN 25/05/2026 was selectable),
    // and sorting soonest-first would otherwise put a dead date at the top.
    var todayStart = new Date(); todayStart.setHours(0,0,0,0);
    var cutoff = todayStart.getTime();
    return tourData.departures
      .filter(function(d) { return d.tour_id === depKey; })
      .filter(function(d) { var t = depTime(d.departure_date); return !t || t >= cutoff; })
      .sort(function(a, b) { return depTime(a.departure_date) - depTime(b.departure_date); });
  }
  function getSelDep() {
    if (!form.departureDate) return null;
    var deps = getDeps();
    for (var i = 0; i < deps.length; i++) {
      if (deps[i].departure_date === form.departureDate) return deps[i];
    }
    return null;
  }
  function parsePrice(v) {
    if (!v) return 0;
    return Number(String(v).replace(/,/g, '')) || 0;
  }
  // 16-day Feast rides the FoSA 21 departure but is priced from its own
  // Tour_Types record (FoSA 16) via /api/tour-prices, year-matched to the departure.
  function priceSource(dep) {
    if (form.tourVariant !== 'feast-16' || !priceData || !priceData.tours || !priceData.tours['feast-16']) return dep;
    var t = priceData.tours['feast-16'];
    var yr = (dep.departure_date || '').slice(-4);
    var y = (t.years && t.years[yr]) ? t.years[yr] : t;
    return {
      base_price: y.base_price, pillion: y.pillion,
      shared_room_discount: -Math.abs(parsePrice(y.shared_room_discount)),
      bike_upgrade_crf1100: y.bike_upgrade_crf1100, bike_upgrade_bmw1250gs: y.bike_upgrade_bmw1250gs
    };
  }
  function getPricing() {
    var dep = getSelDep();
    if (!dep) return { base:0, upgrade:0, pillion:0, shared:0, total:0 };
    var src = priceSource(dep);
    var base = parsePrice(src.base_price);
    var upgrade = 0;
    if (form.bike === 'crf1100') upgrade = parsePrice(src.bike_upgrade_crf1100);
    if (form.bike === 'bmw1250gs') upgrade = parsePrice(src.bike_upgrade_bmw1250gs);
    var pillion = (form.addPillion === 'Yes') ? parsePrice(src.pillion) : 0;
    var shared = (form.roomType !== 'Single') ? parsePrice(src.shared_room_discount) : 0;
    return { base:base, upgrade:upgrade, pillion:pillion, shared:shared, total: base+upgrade+pillion+shared };
  }

  // ── Rendering ──
  function render() {
    var app = document.getElementById('app');
    var html = '';

    // Header (hidden when embedded)
    if (!isEmbedded) {
      html += '<div class="header">';
      html += '<div class="logo">RDS</div>';
      html += '<div><div class="header-text-top">Ride Down South</div>';
      html += '<div class="header-text-sub">Book your African motorcycle adventure</div></div>';
      html += '</div>';
    }

    // Step indicators
    var labels = ['Your Details','Tour & Bike','Riding Experience'];
    html += '<div class="steps">';
    for (var i = 0; i < 3; i++) {
      var s = i + 1;
      var onClass = step >= s ? ' on' : '';
      var activeClass = step === s ? ' active' : '';
      html += '<div style="display:flex;align-items:center;gap:6px;' + (i < 2 ? 'flex:1;' : '') + '">';
      html += '<div class="dot' + onClass + '">' + (step > s ? '\u2713' : s) + '</div>';
      html += '<span class="step-label' + onClass + activeClass + '">' + labels[i] + '</span>';
      if (i < 2) html += '<div class="step-line' + (step > s ? ' done' : '') + '"></div>';
      html += '</div>';
    }
    html += '</div>';

    // Step content
    html += '<div class="body">';

    if (step === 1) html += renderStep1();
    else if (step === 2) html += renderStep2();
    else if (step === 3) html += renderStep3();

    html += '</div>';

    // Footer
    html += '<div class="footer">Questions? Email <a href="mailto:ride@ridedownsouth.com">ride@ridedownsouth.com</a> or call <a href="tel:+27796977110" style="color:#D97B2B;text-decoration:none">+27 79 697 7110</a></div>';

    app.innerHTML = html;
    bindEvents();
  }

  function selectHtml(id, label, req, opts, val) {
    var h = '<label class="field-label">' + label + (req ? '<span class="req">*</span>' : '') + '</label>';
    h += '<select id="' + id + '">';
    for (var i = 0; i < opts.length; i++) {
      var sel = opts[i].v === val ? ' selected' : '';
      h += '<option value="' + opts[i].v + '"' + sel + '>' + opts[i].l + '</option>';
    }
    h += '</select>';
    return h;
  }

  function inputHtml(id, label, req, type, val, ph) {
    var h = '<label class="field-label">' + label + (req ? '<span class="req">*</span>' : '') + '</label>';
    h += '<input type="' + type + '" id="' + id + '" value="' + escHtml(val) + '" placeholder="' + (ph||'') + '">';
    return h;
  }

  function textareaHtml(id, label, req, val, ph) {
    var h = '<label class="field-label">' + label + (req ? '<span class="req">*</span>' : '') + '</label>';
    h += '<textarea id="' + id + '" rows="2" placeholder="' + (ph||'') + '">' + escHtml(val) + '</textarea>';
    return h;
  }

  function radioGroupHtml(name, label, req, opts, val) {
    var h = '<div style="margin-top:22px"><label class="field-label">' + label + (req ? '<span class="req">*</span>' : '') + '</label>';
    h += '<div class="radio-group">';
    for (var i = 0; i < opts.length; i++) {
      var on = val === opts[i] ? ' on' : '';
      h += '<div class="radio-item' + on + '" data-radio="' + name + '" data-val="' + escHtml(opts[i]) + '">';
      h += '<div class="radio-dot' + on + '"><div class="radio-dot-inner"></div></div>';
      h += '<span class="radio-text">' + opts[i] + '</span>';
      h += '</div>';
    }
    h += '</div></div>';

    return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Validation ──
  function validate(s) {
    var e = [];
    if (s >= 1) {
      if (!form.firstName.trim()) e.push('firstName');
      if (!form.lastName.trim()) e.push('lastName');
      if (!form.email.trim() || form.email.indexOf('@') < 1) e.push('email');
      if (!form.phone.trim()) e.push('phone');
      if (!form.country) e.push('country');
    }
    if (s >= 2) {
      if (!form.tourCategory) e.push('tourCategory');
      var isFull = FULL_TOUR[form.tourCategory];
      if (isFull) {
        if (!form.tourVariant) e.push('tourVariant');
        if (!form.departureDate) e.push('departureDate');
        if (!form.participantType) e.push('participantType');
        if (!form.addPillion) e.push('addPillion');
        if (!form.bike) e.push('bike');
        if (form.roomType !== 'Single' && !form.roommateName.trim()) e.push('roommateName');
      }
      if ((form.tourCategory === 'custom' || form.tourCategory === 'oneday' || form.tourCategory === 'other') && !form.customDescription.trim()) e.push('customDescription');
    }
    if (s >= 3) {
      if (!form.yearsRiding) e.push('yearsRiding');
      if (!form.bikeExperience.trim()) e.push('bikeExperience');
      if (!form.previousTours.trim()) e.push('previousTours');
      if (!form.onroad) e.push('onroad');
      if (!form.offroad) e.push('offroad');
      if (!form.licence) e.push('licence');
      if (!form.referral) e.push('referral');
      if (!form.terms) e.push('terms');
    }
    return e;
  }

  // ── Event binding ──
  function bindEvents() {
    // Read form values from DOM
    var fields = ['firstName','lastName','email','phone','country','tourCategory','departureDate','roommateName','customDescription','yearsRiding','bikeExperience','previousTours','medical','anythingElse','referral'];
    for (var i = 0; i < fields.length; i++) {
      (function(field) {
        var el = document.getElementById(field);
        if (el) {
          el.addEventListener('input', function() { form[field] = el.value; });
          el.addEventListener('change', function() {
            form[field] = el.value;
            if (field === 'tourCategory') {
              form.tourVariant = '';
              form.departureDate = '';
              form.bike = '';
              form.addPillion = '';
              form.customDescription = '';
              // Auto-select default variant
              if (TOUR_VARIANTS[form.tourCategory]) {
                var variants = TOUR_VARIANTS[form.tourCategory];
                for (var j = 0; j < variants.length; j++) {
                  if (variants[j].default) { form.tourVariant = variants[j].v; break; }
                }
              }
              render();
            }
            if (field === 'departureDate') render();
            if (field === 'roommateName') render();
          });
        }
      })(fields[i]);
    }

    // Radio buttons — handle tourVariant specially (maps label back to value)
    var radios = document.querySelectorAll('[data-radio]');
    for (var i = 0; i < radios.length; i++) {
      radios[i].addEventListener('click', function() {
        var name = this.getAttribute('data-radio');
        var val = this.getAttribute('data-val');
        if (name === 'tourVariant') {
          // val is the label text, map back to tour_id
          var variants = TOUR_VARIANTS[form.tourCategory] || [];
          for (var j = 0; j < variants.length; j++) {
            if (variants[j].l === val) { form.tourVariant = variants[j].v; break; }
          }
          form.departureDate = '';
          form.bike = '';
        } else {
          form[name] = val;
        }
        render();
      });
    }

    // Checkboxes
    var licenceEl = document.getElementById('licenceCheck');
    if (licenceEl) licenceEl.addEventListener('click', function() { form.licence = !form.licence; render(); });
    var termsEl = document.getElementById('termsCheck');
    if (termsEl) termsEl.addEventListener('click', function(e) {
      if (e.target.tagName === 'A') return;
      form.terms = !form.terms; render();
    });

    // Navigation
    var btn;
    btn = document.getElementById('btnNext1');
    if (btn) btn.addEventListener('click', function() {
      var errs = validate(1);
      if (errs.length) { alert('Please fill in all required fields.'); return; }
      step = 2; render(); window.scrollTo(0,0);
    });
    btn = document.getElementById('btnNext2');
    if (btn) btn.addEventListener('click', function() {
      var errs = validate(2);
      if (errs.length) { alert('Please fill in all required fields, including pillion and motorcycle selection.'); return; }
      step = 3; render(); window.scrollTo(0,0);
    });
    btn = document.getElementById('btnBack2');
    if (btn) btn.addEventListener('click', function() { step = 1; render(); window.scrollTo(0,0); });
    btn = document.getElementById('btnBack3');
    if (btn) btn.addEventListener('click', function() { step = 2; render(); window.scrollTo(0,0); });

    // Submit
    btn = document.getElementById('btnSubmit');
    if (btn) btn.addEventListener('click', function() {
      var errs = validate(3);
      if (errs.length) {
        document.getElementById('submitError').innerHTML = '<p class="err-txt">Please complete all required fields.</p>';
        return;
      }
      submitBooking();
    });
  }

  // ── Submit ──
  function submitBooking() {
    var btn = document.getElementById('btnSubmit');
    if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }
    document.getElementById('submitError').innerHTML = '';

    // Build tour name for Zoho. Full tours use the live tour name; everything
    // else (1-day, other, custom) passes the dropdown label straight through.
    var tourName = '';
    if (FULL_TOUR[form.tourCategory]) {
      var depForName = getSelDep();
      tourName = depForName ? depForName.tour_name : form.tourVariant;
      // 16-day Feast rides the same FoSA 21 departure but hops off at Windhoek
      if (form.tourVariant === 'feast-16' && tourName) {
        tourName += ' - 16-day (hop-off Windhoek)';
      }
    } else {
      for (var ci = 0; ci < TOUR_CATEGORIES.length; ci++) {
        if (TOUR_CATEGORIES[ci].v === form.tourCategory) { tourName = TOUR_CATEGORIES[ci].l; break; }
      }
    }

    var dep = getSelDep();
    var p = getPricing();

    var payload = {
      firstName: form.firstName, lastName: form.lastName, email: form.email,
      phone: form.phone, country: form.country,
      tourCategory: form.tourCategory,
      tourVariant: form.tourVariant,
      tour: tourName,
      departureDate: form.departureDate,
      tourEndDate: dep ? endDateFor(dep) : '',
      customDescription: form.customDescription,
      roomType: form.roomType,
      participantType: form.participantType,
      sharedRoomName: form.roommateName, addPillion: form.addPillion, bike: form.bike,
      basePrice: p.base, upgradeAmount: p.upgrade, pillionAmount: p.pillion, sharedRoomDiscount: p.shared,
      yearsRiding: form.yearsRiding, bikeExperience: form.bikeExperience,
      previousTours: form.previousTours, onroad: form.onroad, offroad: form.offroad,
      licence: form.licence,
      medical: form.medical, anythingElse: form.anythingElse,
      referral: form.referral, terms: form.terms
    };

    fetch(API_BASE + '/api/submit-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.success) {
        showSuccess();
      } else {
        if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
        document.getElementById('submitError').innerHTML = '<p class="err-txt">' + (result.error || 'Something went wrong. Please email ride@ridedownsouth.com') + '</p>';
      }
    })
    .catch(function() {
      if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
      document.getElementById('submitError').innerHTML = '<p class="err-txt">Connection error. Please email ride@ridedownsouth.com</p>';
    });
  }

    var app = document.getElementById('app');
    var h = '';
    if (!isEmbedded) {
      h += '<div class="header"><div class="logo">RDS</div><div>';
      h += '<div class="header-text-top">Ride Down South</div>';
      h += '<div class="header-text-sub">Book your African motorcycle adventure</div></div></div>';
    }
    h += '<div style="text-align:center;padding:64px 28px">';
    h += '<svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" stroke="#D97B2B" stroke-width="2.5"/><path d="M17 29L24 36L39 22" stroke="#D97B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    h += '<h2 style="margin-top:22px;font-size:21px;color:#e8e8e8">Thanks for booking your tour!</h2>';
    h += '<p style="color:#999;font-size:14px;line-height:1.7;max-width:400px;margin:14px auto 0">We\u2019ll be in touch with more details right away. Keep an eye on your inbox.</p>';
    h += '</div>';
    h += '<div class="footer">Questions? Email <a href="mailto:ride@ridedownsouth.com">ride@ridedownsouth.com</a> or call <a href="tel:+27796977110" style="color:#D97B2B;text-decoration:none">+27 79 697 7110</a></div>';
    app.innerHTML = h;
  }

  // ── Init ──
  fetch(API_BASE + '/api/tour-prices')
    .then(function(r) { return r.json(); })
    .then(function(data) { priceData = data; if (tourData) render(); })
    .catch(function() { priceData = null; });
  fetch(API_BASE + '/api/tour-availability')
    .then(function(r) { return r.json(); })
    .then(function(data) { tourData = data; render(); })
